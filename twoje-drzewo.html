<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twoje drzewo – Archiwalne Akty</title><style> *{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#234839;font:16px system-ui}header{background:#234839;color:#fff4dc;padding:20px}header a{color:inherit}main{max-width:1200px;margin:auto;padding:16px}section{background:#fffaf0;border:1px solid #d5cbb5;border-radius:12px;padding:16px;margin-bottom:16px}button,input,select{font:inherit;padding:9px;border:1px solid #aaa;border-radius:5px}button{background:#234839;color:white;cursor:pointer}label{display:block;margin:8px 0}input:not([type=checkbox]){width:100%}details{margin:8px 0;border-bottom:1px solid #ddd;padding:8px}summary{cursor:pointer}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:center}#sheet{width:100%;display:block}footer{text-align:center;padding:20px}@media print{header,footer,#editor,#settings{display:none!important}body,main,#preview{margin:0;padding:0;background:white;border:0;max-width:none}#sheet{width:100%;height:auto;print-color-adjust:exact;-webkit-print-color-adjust:exact}}.guide{font-weight:bold;font-size:13px}.lineA{color:#925681}.lineB{color:#426d95}@media print{.guide{display:none!important}}</style><style id="pageStyle"></style></head><body><header><a href="mapa.html">← Archiwalne Akty</a><h1>Twoje drzewo</h1></header><main><section id="editor"><h2>Baza przodków</h2><p class="guide"><span class="lineA">A – linia żeńska od strony matki</span> · <span class="lineB">B – linia męska od strony ojca</span></p><p>Dane zapisują się w tej przeglądarce. Możesz poprawiać je w dowolnym momencie.</p><div id="people"></div><button id="add">Dodaj rodzeństwo</button><p id="status" role="status"></p></section><section id="settings"><h2>Ustawienia wydruku</h2><div class="settings"><label>Format <select id="format"><option>A3</option><option>A2</option><option>A1</option><option>A0</option></select></label><label>Styl <select id="style"><option value="old">Stary pergamin</option><option value="mono">Czarno-biały</option></select></label><label><input id="blank" type="checkbox"> Puste ramki</label><label><input id="sib" type="checkbox" checked> Rodzeństwo</label></div><div id="levels"></div><button id="print">Drukuj drzewo / zapisz PDF</button></section><section id="preview"><label class="guide"><input type="checkbox" id="guides" checked> Pokaż oznaczenia robocze linii A i B</label><svg id="sheet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990"></svg></section></main><footer>Design Emilia Olszewska</footer><script>
const $=id=>document.getElementById(id), key='aa-tree-v1', fields=['Imię lub imiona','Nazwisko','Nazwisko rodowe','Data urodzenia','Data śmierci'], labels=['Osoba główna','Rodzice','Dziadkowie','Pradziadkowie','Prapradziadkowie','Praprapradziadkowie'];let db={people:{},siblings:[]};try{const x=JSON.parse(localStorage.getItem(key));if(x&&x.people&&Array.isArray(x.siblings))db=x}catch{}let depth=4;
function save(){try{localStorage.setItem(key,JSON.stringify(db));$('status').textContent='Zapisano na tym urządzeniu.'}catch{$('status').textContent='Nie udało się zapisać danych.'}draw()}
function record(parent,id,title,remove){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=title+' — '+(db.people[id]||[]).slice(0,2).join(' ');d.append(s);const f=document.createElement('div');f.className='fields';fields.forEach((name,i)=>{const l=document.createElement('label');l.textContent=name;const input=document.createElement('input');input.value=(db.people[id]||[])[i]||'';if(i>=3)input.placeholder='dd.mm.rrrr lub rok';input.oninput=()=>{(db.people[id]??=[])[i]=input.value;s.textContent=title+' — '+db.people[id].slice(0,2).join(' ');save()};l.append(input);f.append(l)});d.append(f);if(remove){const b=document.createElement('button');b.textContent='Usuń rodzeństwo';b.onclick=()=>{if(confirm('Usunąć tę osobę?')){db.siblings=db.siblings.filter(x=>x!==id);delete db.people[id];save();editor()}};d.append(b)}parent.append(d)}
function editor(){const p=$('people');p.replaceChildren();for(let l=0;l<6;l++){const group=document.createElement('details');group.open=l<2;const s=document.createElement('summary');s.textContent=labels[l]+' ('+2**l+')';group.append(s);for(let i=0;i<2**l;i++){const id=2**l+i;let path=l===0?'Osoba główna':id===2?'Matka':id===3?'Ojciec':Array.from(id.toString(2).slice(1)).map(x=>x==='0'?'matka':'ojciec').join(' → ');record(group,String(id),path+(l>0&&i===0?' [A]':l>0&&i===2**l-1?' [B]':''))}p.append(group)}db.siblings.forEach((id,i)=>record(p,id,'Rodzeństwo '+(i+1),true))}
$('add').onclick=()=>{db.siblings.push('s'+Date.now());save();editor()};for(let i=0;i<6;i++){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=i<depth;c.disabled=i===0;c.onchange=()=>{depth=c.checked?i+1:i;[...$('levels').querySelectorAll('input')].forEach((x,j)=>x.checked=j<depth);draw()};l.append(c,' '+labels[i]);$('levels').append(l)}
const ns='http://www.w3.org/2000/svg';function draw(){const svg=$('sheet');svg.replaceChildren();const old=$('style').value==='old',ink=old?'#76502c':'#222',bg=old?'#efd49a':'#fff',paper=old?'#fff0c8':'#fff';function el(tag,attrs,txt){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(txt)n.textContent=txt;svg.append(n);return n}el('rect',{width:1400,height:990,fill:bg});const y=l=>850-l*740/Math.max(1,depth-1),x=(l,i)=>40+1320*(i+.5)/2**l;for(let l=0;l<depth-1;l++)for(let i=0;i<2**(l+1);i++){const a=x(l,Math.floor(i/2)),b=x(l+1,i),m=(y(l)+y(l+1))/2;el('path',{d:'M'+a+' '+y(l)+' C'+a+' '+m+' '+b+' '+m+' '+b+' '+y(l+1),stroke:ink,'stroke-width':Math.max(2,22-l*5),fill:'none','stroke-linecap':'round'})}el('path',{d:'M700 850 Q690 915 620 955 M700 850 Q710 915 780 955 M700 850 V960',stroke:ink,'stroke-width':13,fill:'none','stroke-linecap':'round'});function box(cx,cy,w,h,id){el('rect',{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:Math.min(7,w/10),fill:paper,stroke:ink,'stroke-width':1.4});if($('blank').checked)return;const d=db.people[id]||[];const lines=[[d[0],d[1]].filter(Boolean).join(' '),d[2]?'z d. '+d[2]:'',[d[3],d[4]].filter(Boolean).join(' – ')].filter(Boolean);lines.forEach((t,i)=>{const fs=Math.min(18,h/4,w/Math.max(1,t.length)*1.6);el('text',{x:cx,y:cy+(i-(lines.length-1)/2)*h/4+fs/3,'text-anchor':'middle','font-size':fs,'font-family':'Georgia',fill:'#222'},t)})}for(let l=1;l<depth;l++)for(let i=0;i<2**l;i++)box(x(l,i),y(l),Math.min(240,1200/2**l),Math.min(75,1200/2**l*.65),String(2**l+i));const roots=['1',...($('sib').checked?db.siblings:[])];roots.forEach((id,i)=>{const cx=700+(i-(roots.length-1)/2)*Math.min(220,1200/roots.length);el('path',{d:'M700 800 V810 H'+cx+' V850',stroke:ink,'stroke-width':3,fill:'none'});box(cx,850,Math.min(200,1200/roots.length-8),75,id)});if($('guides').checked){for(let l=1;l<depth;l++){for(const [i,t,c] of [[0,'A','#925681'],[2**l-1,'B','#426d95']]){el('text',{x:x(l,i),y:y(l)-Math.min(75,1200/2**l*.65)/2-5,'text-anchor':'middle','font-size':16,'font-weight':'bold',fill:c,class:'guide'},t)}}}const sizes={A3:[420,297],A2:[594,420],A1:[841,594],A0:[1189,841]},[w,h]=sizes[$('format').value];$('pageStyle').textContent='@page{size:'+w+'mm '+h+'mm;margin:0}@media print{#sheet{width:'+w+'mm;height:'+h+'mm}}'}
for(const id of ['format','style','blank','sib','guides'])$(id).onchange=draw;$('print').onclick=()=>{draw();window.print()};editor();draw();
</script></body></html>
