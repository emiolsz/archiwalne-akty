<div id="form-inputs">
    <div class="form-group"><label>Numer aktu</label><input type="text" id="f_nr_aktu" value="12"></div>
    <div class="form-group"><label>Miejscowość w marginesie</label><input type="text" id="f_miejscowosc_margines" value="Karolewo"></div>
    <div class="form-group"><label>Miejsce sporządzenia aktu</label><input type="text" id="f_miejsce" value="we wsi Karolewie"></div>
    <div class="form-group"><label>Data aktu słownie</label><input type="text" id="f_data" value="dwudziestego czwartego czerwca tysiąc dziewięćset dwudziestego trzeciego"></div>
    <div class="form-group"><label>Godzina sporządzenia</label><input type="text" id="f_godzina" value="pierwszej po południu"></div>
    <div class="form-group"><label>Stawiający / Zgłaszający zgon</label><textarea id="f_stawiajacy" rows="2">Franciszek Borek, lat pięćdziesiąt i Wojciech Sikora, lat trzydzieści pięć mający, obydwaj wyrobnicy w Karolewie zamieszkali</textarea></div>
    <div class="form-group"><label>Dane zmarłego</label><textarea id="f_zmarly_dane" rows="3">że dnia wczorajszego o godzinie dziesiątej wieczorem umarł w Karolewie Józef Kwiatkowski, lat sześćdziesiąt mający, gospodarz, urodzony w Warszawie, syn nieżyjących Walentego i Katarzyny z Zielińskich małżonków Kwiatkowskich, pozostawiwszy owdowiałą małżonkę Mariannę</textarea></div>
    <div class="form-group"><label>Przekonanie się o zejściu</label><input type="text" id="f_przekonanie" value="po naocznem przekonaniu się o zejściu Józefa Kwiatkowskiego"></div>
    <div class="form-group"><label>Podpis urzędnika / księdza</label><input type="text" id="f_ksiadz" value="Ks. A. Chabowski"></div>
</div>

<div id="form-text">
    Działo się <span class="recznie" id="p_miejsce"></span>, dnia <span class="recznie" id="p_data"></span> roku, o godzinie <span class="recznie" id="p_godzina"></span>. Stawili się <span class="recznie" id="p_stawiajacy"></span> i oświadczyli, <span class="recznie" id="p_zmarly_dane"></span>. Odbywszy obrzęd religijny, <span class="recznie" id="p_przekonanie"></span>, akt ten stawiającym świadkom został przeczytany i podpisany został.
</div>
