<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akta rosyjskie – Warszawa 1915</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe4;color:#203b32;font:16px system-ui}main,header{max-width:1050px;margin:auto;padding:20px}nav{display:flex;gap:16px;flex-wrap:wrap}a{color:inherit}label{display:block;margin:10px 0}input,textarea,select,button{font:inherit;padding:9px;border:1px solid #aaa;border-radius:5px;width:100%}button{background:#254b3b;color:white;margin:6px 0;cursor:pointer}#fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}#paper{background:#f5ecd6;color:#17130e;padding:15mm 12mm;max-width:210mm;margin:auto;min-height:260mm;font:italic 19px/1.8 Georgia,serif;display:grid;grid-template-columns:13mm 1fr;gap:4mm}#number{border-right:1px solid #b8a98c}#body{white-space:pre-wrap;overflow-wrap:anywhere}#paper.hand #body{font-family:'Marck Script',cursive;font-style:normal;background:repeating-linear-gradient(transparent 0 33px,#d8cbb4 34px,transparent 35px);line-height:35px}#paper.pl #body,#paper.trans #body{font-style:normal} @page{size:A4;margin:10mm}@media print{header,#edit,#actions{display:none!important}main{padding:0}#paper{min-height:0;padding:8mm;print-color-adjust:exact;-webkit-print-color-adjust:exact}}[hidden]{display:none!important}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap"><header><nav><a href="generator.html">Katalog</a><a href="?akt=RA">Urodzenie</a><a href="?akt=RM">Małżeństwo</a><a href="?akt=RC">Zgon</a></nav><h1 id="title"></h1><p>Rekonstrukcja formuł kancelaryjnych na podstawie aktów parafii św. Aleksandra, Warszawa 1915. Nie jest faksymile.</p><a id="source">Skan źródłowy</a></header><main><section id="edit"><p>Wpisz dane w odpowiedniej odmianie gramatycznej. Dla tłumaczenia wpisz również polskie odpowiedniki. Pola opcjonalne pozostaw puste.</p><label>Numer aktu<input id="num"></label><label>Data gregoriańska<input type="date" id="date"></label><p id="dual"></p><div id="fields"></div><button id="show">Podgląd aktu</button></section><section id="out" hidden><div id="actions"><button id="back">Wróć do edycji</button><label>Widok<select id="view"><option value="hand">Pismo odręczne</option><option value="trans">Transkrypcja</option><option value="pl">Tłumaczenie polskie</option></select></label><button onclick="window.print()">Drukuj / zapisz PDF</button></div><article id="paper"><aside id="number"></aside><div id="body"></div></article></section></main><script>

function dates(){const s=$('date').value;if(!s)return null;const [y,m,d]=s.split('-').map(Number);const n=Math.floor((14-m)/12),yy=y+4800-n,mm=m+12*n-3,j=d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;const c=j+32082,dd=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*dd/4),f=Math.floor((5*e+2)/153);return [[dd-4800+Math.floor(f/10),f+3-12*Math.floor(f/10),e-Math.floor((153*f+2)/5)+1],[y,m,d]]}

en odczytano.':'Актъ сей прочитанъ.');if(v('sign'))t+='\n\n'+v('sign');$('number').textContent=$('num').value;$('body').textContent=t;$('paper').className=$('view').value}
