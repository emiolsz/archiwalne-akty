<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archiwalne Akty – atlas historyczny</title><link rel="stylesheet" href="archiwalne-akty.css"><style> *{box-sizing:border-box}body{margin:0;color:#203e32;font:16px system-ui}main{max-width:1200px;margin:auto;padding:20px}h1,h2{font-family:Georgia,serif}section{background:#faf7ef;border:1px solid #d8cbb2;border-radius:8px;padding:20px;margin-bottom:18px}.eras{display:flex;flex-wrap:wrap;gap:8px}.eras button{background:#fffaf0;color:#203e32;border:1px solid #b49a62;border-radius:5px;padding:10px;cursor:pointer;font:inherit}.eras button[aria-pressed=true]{background:#203e32;color:white}.atlas{min-height:280px;display:grid;place-items:center;background:#e8dfca;border:1px solid #c5b28b;margin:16px 0;text-align:center;padding:16px}.atlas img{width:100%;max-height:650px;object-fit:contain}.atlas [hidden]{display:none}.legend{display:flex;flex-wrap:wrap;gap:16px}.swatch{display:inline-block;width:15px;height:15px;margin-right:6px;border:1px solid #746b55;vertical-align:middle}#acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}select,input{max-width:100%;padding:10px;font:inherit} @media(max-width:600px){main{padding:10px}section{padding:12px}.atlas{min-height:180px}}#source{font-size:11px;line-height:1.5;color:#59645d;margin:6px 0 0}#source a{color:inherit}</style></head><body><header class="aa-nav"><strong>Archiwalne Akty</strong><a href="index.html">Mapa historyczna</a><a href="#akty">Generator aktów</a><a href="generator.html">Katalog dokumentów</a><a href="o-projekcie.html#historia">Rys historyczny</a></header><main><h1>Polska na przestrzeni wieków</h1><section><div class="eras" id="eras"></div><h2 id="period"></h2><div class="atlas"><div id="map-wrap" style="position:relative;width:min(100%,660px);container-type:inline-size" hidden><img id="map-image" hidden alt="" style="display:block;width:100%;max-height:none"><span id="prus-label" hidden style="position:absolute;left:11%;top:35.7%;width:19%;height:3%;background:#f8b187;color:#161616;font:2.35cqw Arial,sans-serif;white-space:nowrap;text-align:center">Królestwo Prus</span></div><div id="missing">Mapa historyczna w przygotowaniu.</div></div><div id="legend" class="legend"></div><p id="source"></p></section><section id="akty"><h2>Generator aktów</h2><p>Wybierz rok i system rejestracji właściwy dla miejscowości.</p><label>Rok <input type="number" id="year" min="1569" max="1945" value="1569"></label> <label>Obszar / system <select id="region"></select></label><div id="acts" class="aa-controls"></div><iframe id="aa-frame" title="Generator aktu" hidden></iframe><p><a id="full" target="_blank" rel="noopener" hidden>Otwórz dokument w pełnym oknie</a></p></section></main><footer class="aa-footer">Design Emilia Olszewska</footer><script>
const eras=[ [1569,1771,'Rzeczpospolita Obojga Narodów'],[1772,1792,'I rozbiór'],[1793,1794,'II rozbiór'],[1795,1806,'III rozbiór'],[1807,1808,'Księstwo Warszawskie'],[1809,1814,'Księstwo Warszawskie – powiększone'],[1815,1917,'Ziemie pod zaborami'],[1918,1938,'II Rzeczpospolita'],[1939,1944,'Okupacja'],[1945,1945,'Polska po 1945 roku']];
const groups=[
['latin','Księgi łacińskie',['LU','LM','LC'],1569,1795],
['gal','Galicja – księgi tabelaryczne',['GU','GM','GC'],1784,1945],
['prtable','Pruskie księgi tabelaryczne',[null,'T',null],1794,1874],
['nap','Księgi napoleońskie i polskojęzyczne',['NU',null,null],1808,1867],
['rus','Akty rosyjskojęzyczne',['RA','RM','RC'],1868,1918],
['stand','Standesamt',['A','B','C'],1874,1945],
['pol','Polskie księgi narracyjne',['PU','P','PC'],1915,1945]];

const maps={1815:{"file":"https://static.zpe.gov.pl/portal/f/res-minimized/R13tLuQ2vrIli/7/1ac8oNyLsHFhG9Ze5Mvutz1GocvL7ESe.jpg","source":"Krystian Chariza i zespół – Podział ziem polskich","license":"CC BY-SA 3.0","page":"https://zpe.gov.pl/a/na-lasce-cara-krolestwo-polskie/DgvabtSJB"},1807:{"file":"https://static.zpe.gov.pl/portal/f/res-minimized/RuyXUIiHSDUPR/1662485880/wtVGB4QVpyEYSRu4eHYJ24IWNmJcrQQe.png","source":"ContentPlus sp. z o.o. na podstawie Macieja Szczepańczyka (Mathiasrex), Wikimedia Commons","license":"CC BY-SA 3.0","page":"https://zpe.gov.pl/a/przeczytaj/DvJk0FS3M","adapted":true},1809:{"file":"https://static.zpe.gov.pl/portal/f/res-minimized/RF4iQ0lf0Vy6V/1662485880/JwjPUZesvpENKbWhGuCFaY46LfTP8mba.png","source":"ContentPlus sp. z o.o. na podstawie Macieja Szczepańczyka (Mathiasrex), Wikimedia Commons","license":"CC BY-SA 3.0","page":"https://zpe.gov.pl/a/przeczytaj/DvJk0FS3M","adapted":true},1569:{"file":"https://commons.wikimedia.org/wiki/Special:FilePath/Polish-Lithuanian_Commonwealth_in_1619.PNG","source":"Maciej Szczepańczyk (Mathiasrex), na podstawie warstw Halibutt","license":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File:Polish-Lithuanian_Commonwealth_in_1619.PNG"},"1772":{"file":"https://upload.wikimedia.org/wikipedia/commons/e/e8/First_Partition_of_Poland_1772.PNG","source":"Maciej Szczepańczyk (Mathiasrex), na podstawie Halibutt","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:First_Partition_of_Poland_1772.PNG"},"1793":{"file":"https://upload.wikimedia.org/wikipedia/commons/2/27/Second_Partition_of_Poland_1793.PNG","source":"Maciej Szczepańczyk (Mathiasrex), Halibutt, Alokasta","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Second_Partition_of_Poland_1793.PNG"},"1795":{"file":"https://upload.wikimedia.org/wikipedia/commons/3/30/Rzeczpospolita_Rozbiory_3.png","source":"Halibutt – mapa zbiorcza rozbiorów","license":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File:Rzeczpospolita_Rozbiory_3.png"}}; // Wyłącznie zatwierdzone mapy statyczne: rok, plik, źródło, licencja.
const $=id=>document.getElementById(id),year=$('year'),region=$('region'),frame=$('aa-frame'),full=$('full');const q=new URLSearchParams(location.search);
const urls=k=>['A','B','C'].includes(k)?'standesamt.html?akt='+k:k==='T'?'nowe-akty-v10-pdf.html?akt=T':k==='P'?'generator.html?typ=malzenstwo':['RA','RM','RC'].includes(k)?'akty-rosyjskie-1915.html?akt='+k:'karty-historyczne.html?akt='+k;
function open(k){const u=new URL(urls(k),location.href);u.searchParams.set('rok',year.value);frame.src=u.href;frame.hidden=false;full.href=u.href;full.hidden=false}
function draw(){const g=groups.find(x=>x[0]===region.value);$('acts').replaceChildren();['Urodzenia','Małżeństwa','Zgony'].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;const k=g?.[2][i];b.disabled=!k||(Number(year.value)>=1939&&i===0);b.onclick=()=>open(k);$('acts').append(b)})}
function refresh(){const y=Number(year.value),e=eras.find(x=>y>=x[0]&&y<=x[1]);if(!e)return;$('period').textContent=e[2]+' · '+(e[0]===1569?'stan na 1619 r.':y);[...$('eras').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(eras[i]===e)));const m=maps[e[0]],img=$('map-image');img.hidden=!m;$('map-wrap').hidden=!m;$('prus-label').hidden=!m?.adapted;$('missing').hidden=!!m;if(m){img.src=m.file;img.alt=e[2];$('source').replaceChildren(document.createTextNode('Autorem mapy jest: '+m.source+' · '));const l=document.createElement('a');l.href=m.license==='CC BY 3.0'?'https://creativecommons.org/licenses/by/3.0/':'https://creativecommons.org/licenses/by-sa/3.0/';l.textContent=m.license;const p=document.createElement('a');p.href=m.page;p.textContent=m.adapted?'Źródło mapy · korekta nazwy Prus: Archiwalne Akty':'Źródło mapy (oryginał bez zmian)';$('source').append(l,document.createTextNode(' · '),p)}else{img.removeAttribute('src');$('source').textContent='Brak zatwierdzonej ilustracji dla tego okresu.'}const colors=[];$('legend').replaceChildren();if(m){const note=document.createElement('span');note.textContent='Prusy Książęce (Księstwo Pruskie): 1525–1701. Królestwo Prus: 1701–1918.';note.style.fontSize='13px';$('legend').append(note);}colors.forEach(([c,n])=>{const el=document.createElement('span'),sw=document.createElement('i');sw.className='swatch';sw.style.background=c;el.append(sw,n);$('legend').append(el)});const prev=region.value;region.replaceChildren(new Option('Wybierz obszar',''));groups.filter(g=>y>=g[3]&&y<=g[4]).forEach(g=>region.add(new Option(g[1],g[0])));if([...region.options].some(o=>o.value===prev))region.value=prev;frame.hidden=true;full.hidden=true;draw()}
eras.forEach(e=>{const b=document.createElement('button');b.textContent=e[2]+' ('+e[0]+')';b.onclick=()=>{year.value=e[0];refresh()};$('eras').append(b)});year.onchange=refresh;region.onchange=()=>{frame.hidden=true;full.hidden=true;draw()};const yr=Number(q.get('rok'));if(yr>=1569&&yr<=1945)year.value=yr;refresh();const k=q.get('akt'),g=groups.find(x=>x[2].includes(k));if(k&&g&&[...region.options].some(o=>o.value===g[0])){region.value=g[0];draw();if(!(Number(year.value)>=1939&&g[2][0]===k))open(k)}
</script></body></html>
