<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodatek do pokolenia – potomkowie</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae0;color:#234839;font:16px system-ui}header{background:#234839;color:white;padding:20px}header a{color:white}main{max-width:1100px;margin:auto;padding:16px}section,article{background:#fffaf0;border:1px solid #c9b99a;border-radius:8px;padding:12px;margin:12px 0}article article{margin-left:18px}button,input,select{font:inherit;padding:8px;border:1px solid #aaa;border-radius:5px}button{background:#234839;color:white;cursor:pointer;margin:4px}label{display:block;margin:6px 0}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}input:not([type=checkbox]){width:100%}svg{width:100%;display:block}@media print{header,#controls,#edit{display:none!important}body,main,section{margin:0;padding:0;border:0;background:white;max-width:none}svg{print-color-adjust:exact;-webkit-print-color-adjust:exact;max-height:100vh}}</style><style id="page"></style><header><a href="twoje-drzewo.html">← Twoje drzewo</a><h1>Dodatek do pokolenia – potomkowie</h1></header><main><section id="controls"><details><summary>Jak uzupełnić potomków?</summary><p>Wybierz osobę z rodziny. Dodawaj jej małżonków i dzieci, a następnie potomków każdego dziecka. Dane zapisują się w tej przeglądarce. Odznacz pola, których nie chcesz drukować.</p></details><label>Gałąź rodziny <select id="root"></select></label><div id="options"></div><label>Format <select id="format"><option>A3</option><option>A2</option><option>A1</option><option>A0</option></select></label><label>Styl <select id="style"><option value="old">Pergamin</option><option value="mono">Czarno-biały</option></select></label><button id="print">Drukuj dodatek / zapisz PDF</button><p id="status"></p></section><section id="edit"></section><section><svg id="sheet" xmlns="http://www.w3.org/2000/svg"></svg></section></main><script>
const $=id=>document.getElementById(id),key='aa-tree-v1',dk='aa-descendants-v1';function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}const base=load(key,{people:{},siblings:[]}),db=load(dk,{}),roots=['1',...(base.siblings||[])],fields=['Imię lub imiona','Nazwisko rodowe','Nazwisko po ślubie','Data urodzenia','Miejsce urodzenia','Data śmierci','Miejsce zgonu','Dodatkowy wiersz'];function name(d){return [d[0],d[1]||d[2]].filter(Boolean).join(' ')}for(const [i,id] of roots.entries()){const d=base.people[id]||[],o=document.createElement('option');o.value=id;o.textContent=name([d[0],d[2],d[1]])||'Dziecko '+(i+1);$('root').append(o)}function fresh(){return {id:crypto.randomUUID(),data:[],unions:[],children:[]}}function current(){const id=$('root').value;if(!db[id])db[id]=fresh();const d=base.people[id]||[];db[id].data=[d[0],d[2]||d[1],d[1],d[3],d[5],d[4],d[6],d[7]];return db[id]}function save(){try{localStorage.setItem(dk,JSON.stringify(db));$('status').textContent='Zapisano na tym urządzeniu.'}catch{$('status').textContent='Błąd zapisu danych.'}draw()}function button(p,t,fn){const b=document.createElement('button');b.textContent=t;b.onclick=fn;p.append(b)}function inputs(p,d,labels){const f=document.createElement('div');f.className='fields';labels.forEach((t,i)=>{const l=document.createElement('label'),x=document.createElement('input');l.textContent=t;x.value=d[i]||'';x.oninput=()=>{d[i]=x.value;save()};l.append(x);f.append(l)});p.append(f)}function person(p,n,root=false){const a=document.createElement('article'),h=document.createElement('h3');h.textContent=name(n.data)||'Potomek';a.append(h);if(!root)inputs(a,n.data,fields);button(a,'Dodaj małżonka',()=>{n.unions.push({data:[],marriage:[],children:[]});save();editor()});button(a,'Dodaj dziecko bez wskazania małżonka',()=>{n.children.push(fresh());save();editor()});n.unions.forEach((u,i)=>{const b=document.createElement('article');b.append('Małżonek '+(i+1));inputs(b,u.data,fields);inputs(b,u.marriage,['Data ślubu','Miejsce ślubu']);button(b,'Dodaj wspólne dziecko',()=>{u.children.push(fresh());save();editor()});u.children.forEach((c,j)=>{person(b,c);button(b,'Usuń powyższą gałąź',()=>{if(confirm('Usunąć dziecko i jego potomków?')){u.children.splice(j,1);save();editor()}})});a.append(b)});n.children.forEach((c,j)=>{person(a,c);button(a,'Usuń powyższą gałąź',()=>{if(confirm('Usunąć dziecko i jego potomków?')){n.children.splice(j,1);save();editor()}})});p.append(a)}function editor(){$('edit').replaceChildren();person($('edit'),current(),true);draw()}const opts=[...fields,'Data ślubu','Miejsce ślubu','Puste ramki'];opts.forEach((t,i)=>{const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.id='o'+i;c.checked=[0,1,3,5].includes(i);c.onchange=draw;l.append(c,' '+t);$('options').append(l)});function draw(){const svg=$('sheet');svg.replaceChildren();const old=$('style').value==='old',ink=old?'#76502c':'#222',paper=old?'#fff0c8':'#fff';const ns='http://www.w3.org/2000/svg';function el(t,a,v){const n=document.createElementNS(ns,t);Object.entries(a).forEach(([k,x])=>n.setAttribute(k,x));if(v)n.textContent=v;svg.append(n)}const root=current();function groups(n){return [...n.unions.map(u=>({u,children:u.children})),...(n.children.length?[{u:null,children:n.children}]:[])]}function span(n){return Math.max(1,groups(n).reduce((s,g)=>s+Math.max(g.u?2:1,g.children.reduce((a,c)=>a+span(c),0)),0))}let max=0;function dep(n,d){max=Math.max(max,d);groups(n).forEach(g=>g.children.forEach(c=>dep(c,d+1)))}dep(root,0);const W=Math.max(1000,span(root)*210),H=Math.max(707,170+max*230);svg.setAttribute('viewBox','0 0 '+W+' '+H);el('rect',{width:W,height:H,fill:old?'#efd49a':'#fff'});function line(d){el('path',{d,stroke:ink,'stroke-width':2,fill:'none'})}function box(x,y,d){el('rect',{x:x-92,y:y-48,width:184,height:96,rx:5,fill:paper,stroke:ink});if($('o10').checked)return;const lines=d.filter((v,i)=>v&&$('o'+i).checked);lines.forEach((t,i)=>el('text',{x,y:y+(i-(lines.length-1)/2)*12+4,'text-anchor':'middle','font-family':'Georgia, serif','font-size':11,fill:ink},t))}function node(n,left,d){const width=span(n)*210,x=left+width/2,y=80+d*230;box(x,y,n.data);let at=left;for(const g of groups(n)){const gw=Math.max(g.u?2:1,g.children.reduce((a,c)=>a+span(c),0))*210,m=at+gw/2;let cy=y+110;line('M'+x+' '+(y+48)+' V'+(y+65)+' H'+m+' V'+cy);if(g.u){box(m,cy,g.u.data);const v=g.u.marriage.filter((t,i)=>t&&$('o'+(8+i)).checked);if(v.length&&!$('o10').checked)v.forEach((t,i)=>el('text',{x:m+100,y:cy+i*13,'font-family':'Georgia, serif','font-size':11,fill:ink},t))}let cLeft=at+(gw-g.children.reduce((a,c)=>a+span(c)*210,0))/2;for(const c of g.children){const cx=cLeft+span(c)*105;line('M'+m+' '+(g.u?cy+48:cy)+' V'+(y+170)+' H'+cx+' V'+(y+182));node(c,cLeft,d+1);cLeft+=span(c)*210}at+=gw}}node(root,(W-span(root)*210)/2,0);const [w,h]={A3:[420,297],A2:[594,420],A1:[841,594],A0:[1189,841]}[$('format').value];$('page').textContent='@page{size:'+w+'mm '+h+'mm;margin:5mm}'}$('root').onchange=editor;$('format').onchange=draw;$('style').onchange=draw;$('print').onclick=()=>window.print();editor();
</script></html>
