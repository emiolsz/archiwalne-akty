zędnikiem Stanu Cywilnego gminy |gmina|, stawił się |zgłaszający|, liczący lat |wiek|, i okazał nam dziecię płci |płeć|, urodzone dnia |data| o godzinie |godzina| z |matka|. Oświadczył, iż nadać mu chce imię |imię|. Oświadczenie uczyniono w przytomności |świadkowie|. Akt niniejszy po przeczytaniu |formuła podpisania|.","PU":"Działo się w |miejscowość| dnia |data słownie| o godzinie |godzina|. Stawił się |ojciec, wiek, zawód, zamieszkanie| w obecności |świadkowie| i okazał Nam dziecię płci |płeć|, urodzone w |miejsce| dnia |data urodzenia| o godzinie |godzina urodzenia| z jego małżonki |matka, nazwisko rodowe, wiek|. Dziecięciu temu na chrzcie świętym nadano imię |imię|, a rodzicami jego chrzestnymi byli |chrzestni|. Akt ten |formuła odczytania i podpisania|.","PC":"Działo się w |miejscowość| dnia |data słownie| o godzinie |godzina|. Stawili się |zgłaszający| i oświadczyli, że dnia |data zgonu| o godzinie |godzina zgonu| w |miejsce zgonu| zmarł / zmarła |imię i nazwisko|, lat |wiek|, |stan i zawód|, urodzony / urodzona w |miejsce urodzenia|, |rodzice|. Po przekonaniu się o zejściu |nazwisko| akt ten |formuła odczytania i podpisania|."};forms[k in forms?k:'NU'].split('|').forEach((v,i)=>{if(i%2){const f=document.createElement('span');f.className='field';f.contentEditable='true';f.setAttribute('aria-label',v);f.title=v;e.append(f)}else e.append(document.createTextNode(v))});p.append(e)}document.getElementById('hand').onchange=e=>{p.style.setProperty('--hand',JSON.stringify(e.target.value));p.querySelectorAll('td,.margin').forEach(x=>x.style.fontFamily=e.target.value)};document.getElementById('clear').onclick=()=>{if(confirm('Wyczyścić dane aktu?'))p.querySelectorAll('[contenteditable]').forEach(x=>x.textContent='')};document.getElementById('blank').onclick=()=>p.classList.add('blank');document.getElementById('edit').onclick=()=>{p.classList.remove('blank');p.querySelector('[contenteditable]').focus()};</script></html>
